<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- 폰트 로드 -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&amp;family=Jua&amp;display=swap');
      
      .title-text {
        font-family: 'Fredoka', 'Jua', sans-serif;
        font-weight: 700;
        fill: #ffffff;
      }
      .badge-text {
        font-family: 'Jua', sans-serif;
        fill: #7b4317;
      }
      .card-title {
        font-family: 'Jua', sans-serif;
        font-size: 26px;
        fill: #3e2714;
        text-anchor: middle;
      }
      .card-desc {
        font-family: 'Jua', sans-serif;
        font-size: 17px;
        fill: #7a5c48;
        text-anchor: middle;
      }
      .tag-text {
        font-family: 'Jua', sans-serif;
        font-size: 22px;
        fill: #2c4d36;
      }
    </style>

    <!-- 그림자 필터들 -->
    <filter id="shadow-deep" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#14321e" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#14321e" flood-opacity="0.18" />
    </filter>

    <filter id="shadow-card" x="-15%" y="-15%" width="130%" height="135%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#234220" flood-opacity="0.2" />
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#234220" flood-opacity="0.15" />
    </filter>

    <filter id="shadow-title" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="0" flood-color="#b9662a" flood-opacity="1" />
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#783c14" flood-opacity="0.4" />
    </filter>

    <filter id="shadow-hill" x="-5%" y="-10%" width="110%" height="120%">
      <feDropShadow dx="0" dy="-6" stdDeviation="8" flood-color="#285a28" flood-opacity="0.2" />
    </filter>

    <filter id="shadow-badge" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#5a3210" flood-opacity="0.2" />
    </filter>
  </defs>

  <!-- 1. 배경 하늘 -->
  <rect width="1200" height="630" fill="#8fd3c3" />

  <!-- 2. 구름들 (종이 공예 겹침 질감) -->
  <g opacity="0.95">
    <!-- 좌상단 구름 -->
    <g transform="translate(60, 40) scale(1.1)">
      <path d="M14 52 Q2 52 4 40 Q6 28 22 30 Q26 10 48 14 Q62 0 80 12 Q104 6 108 28 Q126 30 124 44 Q122 52 110 52 Z" fill="#d8ebe5" transform="translate(6, 6)" />
      <path d="M14 52 Q2 52 4 40 Q6 28 22 30 Q26 10 48 14 Q62 0 80 12 Q104 6 108 28 Q126 30 124 44 Q122 52 110 52 Z" fill="#ffffff" />
    </g>
    <!-- 중앙 우측 구름 -->
    <g transform="translate(980, 70) scale(1.3)">
      <path d="M14 52 Q2 52 4 40 Q6 28 22 30 Q26 10 48 14 Q62 0 80 12 Q104 6 108 28 Q126 30 124 44 Q122 52 110 52 Z" fill="#d8ebe5" transform="translate(6, 6)" />
      <path d="M14 52 Q2 52 4 40 Q6 28 22 30 Q26 10 48 14 Q62 0 80 12 Q104 6 108 28 Q126 30 124 44 Q122 52 110 52 Z" fill="#ffffff" />
    </g>
    <!-- 좌측 보조 구름 -->
    <g transform="translate(280, 110) scale(0.85)">
      <path d="M14 52 Q2 52 4 40 Q6 28 22 30 Q26 10 48 14 Q62 0 80 12 Q104 6 108 28 Q126 30 124 44 Q122 52 110 52 Z" fill="#d8ebe5" transform="translate(4, 5)" />
      <path d="M14 52 Q2 52 4 40 Q6 28 22 30 Q26 10 48 14 Q62 0 80 12 Q104 6 108 28 Q126 30 124 44 Q122 52 110 52 Z" fill="#ffffff" />
    </g>
  </g>

  <!-- 3. 중앙 따뜻한 종이 태양 링 (레이어 스택) -->
  <g transform="translate(600, 195)">
    <circle r="148" fill="#eea04f" filter="url(#shadow-badge)" />
    <circle r="134" fill="#f3ac5a" />
    <circle r="120" fill="#f5b665" />
    <circle r="106" fill="#f7c070" />
    <circle r="92"  fill="#f8c97c" />
    <circle r="78"  fill="#f9d188" />
    <circle r="64"  fill="#fad894" />
    <circle r="50"  fill="#fbdfa0" />
  </g>

  <!-- 4. 종이 언덕 레이어 (입체 그림자) -->
  <g filter="url(#shadow-hill)">
    <path d="M0 630 L0 340 Q300 300 600 350 T1200 330 L1200 630 Z" fill="#a9d48c" />
    <path d="M0 630 L0 380 Q320 350 640 400 T1200 370 L1200 630 Z" fill="#c6e3a2" />
    <path d="M0 630 L0 430 Q280 400 580 440 T1200 420 L1200 630 Z" fill="#93c57a" />
    <path d="M0 630 L0 480 Q340 460 700 490 T1200 470 L1200 630 Z" fill="#b5da92" />
    <path d="M0 630 L0 540 Q300 530 600 550 T1200 530 L1200 630 Z" fill="#84b96d" />
  </g>

  <!-- 5. 언덕 위의 아기자기한 하얀 종이 거북이 마스코트 (좌측) -->
  <g transform="translate(140, 240) scale(1.35)" filter="url(#shadow-deep)">
    <!-- 다리와 꼬리 -->
    <ellipse cx="40" cy="74" rx="11" ry="10" fill="#d9e3df" />
    <ellipse cx="96" cy="74" rx="11" ry="10" fill="#d9e3df" />
    <path d="M112 58 L134 64 L112 67 Z" fill="#d9e3df" />
    <!-- 목과 머리 -->
    <path d="M22 50 Q10 18 26 12 Q42 8 42 30 L46 56 Z" fill="#ffffff" />
    <!-- 귀여운 미소 눈 -->
    <path d="M22 18 Q28 15 31 20" stroke="#7a968e" stroke-width="2.6" fill="none" stroke-linecap="round" />
    <!-- 볼터치 홍조 -->
    <ellipse cx="28" cy="24" rx="4" ry="2.5" fill="#f7b5be" opacity="0.85" />
    <!-- 등껍질 돔 -->
    <path d="M28 66 Q30 24 70 22 Q110 24 116 66 Z" fill="#ffffff" />
    <!-- 등껍질 무늬 -->
    <path d="M44 40 Q70 28 98 40 M38 54 Q70 42 106 54" stroke="#d5e3de" stroke-width="3.5" fill="none" stroke-linecap="round" />
    <rect x="26" y="62" width="92" height="9" rx="4.5" fill="#e5eee9" />
  </g>

  <!-- 6. 타이틀 영역: Turtle Dobble + 모바일 버전 뱃지 -->
  <g transform="translate(600, 140)" filter="url(#shadow-title)">
    <text class="title-text" font-size="74" letter-spacing="1" text-anchor="middle" y="0">Turtle Dobble</text>
  </g>

  <!-- 모바일 버전 뱃지 (경쾌하게 회전된 종이 태그) -->
  <g transform="translate(895, 115) rotate(-6)" filter="url(#shadow-badge)">
    <rect x="-60" y="-18" width="120" height="36" rx="18" fill="#fff5db" stroke="#e2ad64" stroke-width="3" />
    <text class="badge-text" font-size="17" font-weight="bold" text-anchor="middle" y="6">모바일 버전</text>
  </g>

  <!-- 서브 타이틀: 설명 문구 태그 -->
  <g transform="translate(600, 205)" filter="url(#shadow-badge)">
    <rect x="-240" y="-20" width="480" height="40" rx="20" fill="#ffffff" opacity="0.94" stroke="#a0caa8" stroke-width="2.5" />
    <text class="tag-text" text-anchor="middle" y="8">🐢 순발력과 관찰력으로 같은 글자를 찾아라! ✨</text>
  </g>

  <!-- 7. 핵심 게임 모드 3종 카드 쇼케이스 (혼자 하기 / 대결하기 / 같이하기) -->
  <g transform="translate(600, 440)">
    <!-- 카드 1: 혼자 하기 -->
    <g transform="translate(-320, 0)" filter="url(#shadow-card)">
      <!-- 카드 배경 (종이 스택) -->
      <rect x="-135" y="-140" width="270" height="235" rx="24" fill="#fdfbf5" stroke="#eadbb9" stroke-width="3" />
      
      <!-- 아이콘 원형 스택 -->
      <g transform="translate(0, -60)">
        <circle r="44" fill="#fde68a" stroke="#fcd34d" stroke-width="2.5" />
        <circle r="36" fill="#fef3c7" />
        <!-- 거북이 등껍질 아이콘 -->
        <path d="M-8 -6 L-8 -18 A6 6 0 0 1 8 -18 L8 -6 Z" fill="#f1dcc0" />
        <path d="M-26 18 Q-26 -10 0 -10 Q26 -10 26 18 Z" fill="#86b77e" />
        <path d="M-14 0 L10 18 M0 -8 L22 12 M14 0 L-10 18 M0 -8 L-22 12" stroke="#5f8a58" stroke-width="1.8" opacity="0.6" stroke-linecap="round" />
      </g>
      
      <text class="card-title" y="32">혼자 하기</text>
      <text class="card-desc" y="62">바다에서 혼자 연습해요</text>
      <rect x="-65" y="80" width="130" height="24" rx="12" fill="#fef3c7" stroke="#fde68a" stroke-width="1.5" />
      <text font-family="'Jua', sans-serif" font-size="13" fill="#92400e" text-anchor="middle" y="97">도전 &amp; 서바이벌</text>
    </g>

    <!-- 카드 2: 대결하기 -->
    <g transform="translate(0, -10)" filter="url(#shadow-card)">
      <!-- 하이라이트 배지: 2인 플레이 -->
      <rect x="-140" y="-145" width="280" height="245" rx="26" fill="#ffffff" stroke="#f3b8c6" stroke-width="3.5" />
      
      <!-- 아이콘 원형 스택 -->
      <g transform="translate(0, -64)">
        <circle r="46" fill="#fbcfe8" stroke="#f472b6" stroke-width="2.5" />
        <circle r="38" fill="#fdf2f8" />
        <!-- 대결 원형 겹침 심볼 -->
        <circle cx="-11" cy="4" r="19" fill="#f43f5e" opacity="0.85" />
        <circle cx="11" cy="-2" r="19" fill="#38bdf8" opacity="0.88" />
      </g>
      
      <text class="card-title" font-size="28" y="30">대결하기</text>
      <text class="card-desc" font-size="18" y="60">둘이서 먼저 찾기 대결</text>
      <rect x="-70" y="80" width="140" height="26" rx="13" fill="#fce7f3" stroke="#fbcfe8" stroke-width="1.5" />
      <text font-family="'Jua', sans-serif" font-size="14" fill="#9d174d" font-weight="bold" text-anchor="middle" y="98">1:1 실시간 맞대결</text>
    </g>

    <!-- 카드 3: 같이하기 -->
    <g transform="translate(320, 0)" filter="url(#shadow-card)">
      <!-- 카드 배경 -->
      <rect x="-135" y="-140" width="270" height="235" rx="24" fill="#fdfbf5" stroke="#c4dfa0" stroke-width="3" />
      
      <!-- 아이콘 원형 스택 -->
      <g transform="translate(0, -60)">
        <circle r="44" fill="#d9f99d" stroke="#a3e635" stroke-width="2.5" />
        <circle r="36" fill="#f7fee7" />
        <!-- 보스 거북이 기어 심볼 -->
        <g transform="scale(0.85)">
          <path d="M0 -24 L4 -16 L12 -20 L14 -12 L22 -12 L20 -4 L26 2 L20 8 L22 16 L14 16 L12 24 L4 20 L0 26 L-4 20 L-12 24 L-14 16 L-22 16 L-20 8 L-26 2 L-20 -4 L-22 -12 L-14 -12 L-12 -20 L-4 -16 Z" fill="#3f4a24" />
          <circle r="15" fill="#6b7a3a" />
          <circle r="10" fill="#eef3dc" />
        </g>
      </g>
      
      <text class="card-title" y="32">같이하기</text>
      <text class="card-desc" y="62">함께 악당 거북이를 물리쳐요</text>
      <rect x="-65" y="80" width="130" height="24" rx="12" fill="#ecfccb" stroke="#d9f99d" stroke-width="1.5" />
      <text font-family="'Jua', sans-serif" font-size="13" fill="#3f6212" text-anchor="middle" y="97">협동 보스전</text>
    </g>
  </g>

  <!-- 8. 하단 바닥 정보 배너 -->
  <g transform="translate(600, 595)">
    <rect x="-550" y="-18" width="1100" height="36" rx="18" fill="#2d5236" opacity="0.88" />
    <text font-family="'Jua', sans-serif" font-size="16" fill="#f0faf3" text-anchor="middle" y="6">
      📱 스마트폰 화면 최적화 • 🎮 설치 없이 브라우저에서 바로 플레이 • 🔤 한글 자음/단어/알파벳 지원
    </text>
  </g>
</svg>
